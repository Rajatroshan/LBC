<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Temple Shikhara Gradient -->
    <linearGradient id="templeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Golden Kalash Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Flag Gradient -->
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Avatar Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Kurta / Attire Gradient -->
    <linearGradient id="kurtaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Smooth SVG Animations */
      @keyframes swayDhwaja {
        0%, 100% { transform: rotate(0deg) skewY(0deg); }
        50% { transform: rotate(-8deg) skewY(-4deg); }
      }
      @keyframes pulseKalash {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #F59E0B); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 10px #FEF08A); }
      }
      @keyframes floatSparkle {
        0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.7; }
        50% { transform: translateY(-6px) scale(1.15); opacity: 1; }
      }
      @keyframes gentleBobAvatar {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes flameFlicker {
        0%, 100% { transform: scale(1) rotate(0deg); }
        25% { transform: scale(1.06, 0.94) rotate(-2deg); }
        75% { transform: scale(0.95, 1.05) rotate(2deg); }
      }
      @keyframes sunRaysRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .animated-flag {
        transform-origin: 256px 65px;
        animation: swayDhwaja 2.8s ease-in-out infinite;
      }
      .animated-kalash {
        transform-origin: 256px 75px;
        animation: pulseKalash 2.2s ease-in-out infinite;
      }
      .animated-avatar {
        transform-origin: 256px 360px;
        animation: gentleBobAvatar 3.2s ease-in-out infinite;
      }
      .animated-sparkle-1 {
        transform-origin: 100px 120px;
        animation: floatSparkle 2.4s ease-in-out infinite;
      }
      .animated-sparkle-2 {
        transform-origin: 410px 140px;
        animation: floatSparkle 3s ease-in-out infinite 0.6s;
      }
      .animated-flame {
        transform-origin: 256px 445px;
        animation: flameFlicker 1.8s ease-in-out infinite;
      }
      .animated-rays {
        transform-origin: 256px 150px;
        animation: sunRaysRotate 30s linear infinite;
      }
    </style>
  </defs>

  <!-- 1. Background Rounded App Base -->
  <rect width="512" height="512" rx="116" fill="url(#skyGrad)" />
  <rect x="14" y="14" width="484" height="484" rx="102" fill="none" stroke="#FEF3C7" stroke-width="6" stroke-dasharray="14 10" opacity="0.65" />

  <!-- 2. Rotating Aura / Sunburst behind Temple -->
  <g class="animated-rays" opacity="0.25">
    <circle cx="256" cy="150" r="140" fill="none" stroke="#FEF08A" stroke-width="4" stroke-dasharray="8 14" />
    <line x1="256" y1="0" x2="256" y2="300" stroke="#FEF08A" stroke-width="3" />
    <line x1="106" y1="150" x2="406" y2="150" stroke="#FEF08A" stroke-width="3" />
    <line x1="150" y1="44" x2="362" y2="256" stroke="#FEF08A" stroke-width="3" />
    <line x1="150" y1="256" x2="362" y2="44" stroke="#FEF08A" stroke-width="3" />
  </g>

  <!-- 3. Auspicious Floating Sparkles ✨ -->
  <g class="animated-sparkle-1">
    <path d="M100 110 L104 118 L112 122 L104 126 L100 134 L96 126 L88 122 L96 118 Z" fill="#FEF08A" filter="url(#softGlow)" />
  </g>
  <g class="animated-sparkle-2">
    <path d="M410 130 L413 137 L420 140 L413 143 L410 150 L407 143 L400 140 L407 137 Z" fill="#FEF08A" filter="url(#softGlow)" />
  </g>

  <!-- 4. TRADITIONAL INDIAN TEMPLE (MANDIR) -->
  <g id="temple-structure">
    <!-- Temple Platform / Plinth -->
    <path d="M110 320 L402 320 L420 355 L92 355 Z" fill="#78350F" stroke="#451A03" stroke-width="4" />
    <rect x="130" y="310" width="252" height="12" rx="4" fill="#D97706" />

    <!-- Main Temple Outer Walls -->
    <rect x="146" y="195" width="220" height="115" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="5" />

    <!-- Carved Pillars (Left & Right) -->
    <rect x="156" y="200" width="22" height="110" rx="6" fill="#FDE68A" stroke="#D97706" stroke-width="3" />
    <rect x="334" y="200" width="22" height="110" rx="6" fill="#FDE68A" stroke="#D97706" stroke-width="3" />
    <!-- Pillar Capitals -->
    <path d="M150 200 L184 200 L176 212 L158 212 Z" fill="#D97706" />
    <path d="M328 200 L362 200 L354 212 L336 212 Z" fill="#D97706" />

    <!-- Inner Mandap Sanctum Arch -->
    <path d="M196 310 L196 230 Q256 195 316 230 L316 310 Z" fill="#EA580C" stroke="#9A3412" stroke-width="4" />
    <!-- Inner Sanctum Glow -->
    <circle cx="256" cy="245" r="28" fill="#FEF08A" opacity="0.6" filter="url(#softGlow)" />

    <!-- Temple Roof Eaves (Chhajja) -->
    <path d="M126 198 L386 198 L398 184 L114 184 Z" fill="#B45309" stroke="#78350F" stroke-width="4" />
    <path d="M140 184 L372 184 L380 172 L132 172 Z" fill="#D97706" />

    <!-- Layered Curvilinear Shikhara (Gopuram Tower) -->
    <path d="M152 172 Q180 100 240 76 L272 76 Q332 100 360 172 Z" fill="url(#templeGrad)" stroke="#7F1D1D" stroke-width="5" />
    
    <!-- Shikhara Horizontal Ribs (Bhumi Tiers) -->
    <path d="M168 150 Q256 138 344 150" stroke="#FEF08A" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M188 126 Q256 116 324 126" stroke="#FEF08A" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M214 100 Q256 94 298 100" stroke="#FEF08A" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Amalaka (Ribbed Stone Ring at Top) -->
    <ellipse cx="256" cy="74" rx="26" ry="9" fill="#F59E0B" stroke="#B45309" stroke-width="3" />

    <!-- 5. Golden Kalash (Animated) -->
    <g class="animated-kalash">
      <!-- Kalash Pot -->
      <path d="M248 72 C246 64 266 64 264 72 C266 76 246 76 248 72 Z" fill="url(#goldGrad)" stroke="#78350F" stroke-width="2" />
      <circle cx="256" cy="62" r="7" fill="url(#goldGrad)" stroke="#92400E" stroke-width="2" />
      <polygon points="256,48 252,56 260,56" fill="#FDE047" />
    </g>

    <!-- 6. Waving Saffron Flag (Dhwaja with Animation) -->
    <g class="animated-flag">
      <!-- Flag Staff (Pole) -->
      <line x1="256" y1="65" x2="256" y2="22" stroke="#78350F" stroke-width="4" stroke-linecap="round" />
      <circle cx="256" cy="20" r="3" fill="#FDE047" />
      <!-- Triangular Dhwaja -->
      <path d="M256 24 Q290 32 316 26 L298 42 Q275 36 256 46 Z" fill="url(#flagGrad)" stroke="#C2410C" stroke-width="2" />
    </g>
  </g>

  <!-- 7. FRIENDLY VILLAGE AVATAR (PUJARI / SADASYA IN NAMASTE 🙏) -->
  <g class="animated-avatar">
    <!-- Drop Shadow under Avatar -->
    <ellipse cx="256" cy="455" rx="70" ry="12" fill="#000000" opacity="0.2" />

    <!-- Body / White Kurta -->
    <path d="M210 440 L214 360 C214 340 298 340 298 360 L302 440 Z" fill="url(#kurtaGrad)" stroke="#D97706" stroke-width="4" />
    
    <!-- Saffron Uttariya / Angavastram (Stole over shoulders) -->
    <path d="M210 365 Q256 395 302 365 Q308 395 300 425 Q256 415 212 425 Z" fill="#EA580C" stroke="#9A3412" stroke-width="3" />

    <!-- Head / Face -->
    <circle cx="256" cy="316" r="32" fill="url(#skinGrad)" stroke="#B45309" stroke-width="3.5" />
    
    <!-- Big Friendly Smile & Cheeks -->
    <path d="M246 325 Q256 335 266 325" stroke="#78350F" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="240" cy="322" r="3.5" fill="#F87171" opacity="0.7" />
    <circle cx="272" cy="322" r="3.5" fill="#F87171" opacity="0.7" />

    <!-- Happy Eyes (Arched) -->
    <path d="M242 312 Q246 307 250 312" stroke="#451A03" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M262 312 Q266 307 270 312" stroke="#451A03" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Red Chandan Tilak on Forehead -->
    <path d="M256 295 L256 306" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="256" cy="309" r="2" fill="#F59E0B" />

    <!-- Auspicious Saffron Pagdi / Turban -->
    <path d="M222 300 Q256 270 290 300 Q296 280 256 272 Q216 280 222 300 Z" fill="#EA580C" stroke="#9A3412" stroke-width="3" />
    <circle cx="256" cy="280" r="4.5" fill="#FEF08A" />

    <!-- Folded Hands in Namaste (Anjali Mudra 🙏) -->
    <g transform="translate(0, 0)">
      <ellipse cx="256" cy="382" rx="14" ry="18" fill="#FDE68A" stroke="#B45309" stroke-width="3" />
      <path d="M256 366 L256 398" stroke="#B45309" stroke-width="2" />
    </g>
  </g>

  <!-- 8. AUSPICIOUS FOREGROUND DIYA (ANIMATED FLAME) -->
  <g transform="translate(0, 5)">
    <!-- Diya Bowl -->
    <path d="M216 460 C216 484 296 484 296 460 Z" fill="#D97706" stroke="#78350F" stroke-width="3.5" />
    
    <!-- Glowing Animated Flame -->
    <g class="animated-flame" filter="url(#softGlow)">
      <path d="M256 428 C266 442 268 452 256 460 C244 452 246 442 256 428 Z" fill="#EF4444" />
      <path d="M256 436 C262 445 264 452 256 458 C248 452 250 445 256 436 Z" fill="#FEF08A" />
    </g>
  </g>

  <!-- 9. Crisp Village Branding Text at Base -->
  <rect x="100" y="475" width="312" height="26" rx="13" fill="#1C1917" opacity="0.9" />
  <text x="256" y="492" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#FEF08A" text-anchor="middle" letter-spacing="2">🌾 LBC MANDAP • 100% KHULA HISAB</text>
</svg>
