<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline • LBC Mandap</title>
  <meta name="theme-color" content="#EA580C">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #FFFDF7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1C1917;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      border: 2px solid #FCD34D;
      border-radius: 28px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 35px rgba(217, 119, 6, 0.08);
      position: relative;
      overflow: hidden;
    }
    .diya-circle {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: #FEF3C7;
      border: 2px solid #FDE68A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin: 0 auto 18px auto;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #FEF3C7;
      color: #92400E;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      border: 1px solid #FDE68A;
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      color: #1C1917;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      line-height: 1.6;
      color: #78716C;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 13px 24px;
      background: linear-gradient(135deg, #EA580C 0%, #D97706 100%);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 14px;
      border-radius: 18px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.35);
      transition: all 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .footer-note {
      margin-top: 18px;
      font-size: 11px;
      color: #A8A29E;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="diya-circle">🪔</div>
    <div class="badge">Network Disconnected</div>
    <h1>Aap Offline Hain</h1>
    <p>
      Internet connection is currently unavailable in your area. Don't worry, your registered data is safe. Please reconnect to mobile network or Wi-Fi to sync with the Mandap.
    </p>
    <button class="btn" onclick="window.location.reload()">
      🔄 Try Reconnecting
    </button>
    <div class="footer-note">
      🌾 LBC Mandap • 100% Khula Hisab
    </div>
  </div>
</body>
</html>
